worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态文件
        location / {
            root   /Users/zhonglei/Desktop/AllProjects/label-studio-cn/web/dist/apps/labelstudio;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 代理
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源
        location /static/ {
            alias /Users/zhonglei/Desktop/AllProjects/label-studio-cn/label_studio/static_build/;
        }

        # 媒体文件
        location /data/ {
            alias /Users/zhonglei/Desktop/AllProjects/label-studio-cn/label_studio/data/;
        }
    }
} 